# =====================================================================
# Elite Energy overrides on top of Lewa-Reka's deye_hybrid_3p_lv package.
# Included from firmware/devices/*.yaml — never used standalone.
#
# Lewa-Reka already provides: esphome / api / ota / wifi / captive_portal
# / logger / uart / modbus / modbus_controller / diagnostic sensors.
# This file adds the Elite-Energy-specific bits:
#   - Project name + version (overrides Lewa-Reka's so HA shows our brand)
#   - Stock ESPHome MQTT-TLS publisher  -> elite.prygoda.xyz
#   - Custom external components for partner + Solarman cloud publishers
#   - Status binary sensor + reboot button
# ---------------------------------------------------------------------

substitutions:
  # WiFi / API / OTA / fallback hotspot creds resolve via !secret.
  wifi_ssid:           !secret wifi_ssid
  wifi_password:       !secret wifi_password
  fallback_password:   !secret fallback_password
  api_key:             !secret api_key
  ota_password:        !secret ota_password

esphome:
  project:
    name: "elite_energy.dongle"
    version: "0.1.0"
  comment: "Elite Energy dongle — Deye 3p LV (register heritage: Lewa-Reka)"

# Lewa-Reka's package ships an api.encryption.key placeholder that fails
# ESPHome's base64 validator. Override with a real key from secrets.yaml.
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ---- Stock ESPHome MQTT-TLS publisher (endpoint #1: our prod) ----
# Topic taxonomy matches infra/emqx/acl.conf in elite-energy:
#   v1/t/{tenant}/s/{site}/i/{inverter}/sensor/{name}/state
mqtt:
  broker:        !secret mqtt_elite_broker
  port:          !secret mqtt_elite_port
  username:      !secret mqtt_elite_username
  password:      !secret mqtt_elite_password
  client_id:     "${name}-elite"
  topic_prefix:  "v1/t/${tenant_slug}/s/${site_slug}/i/${inverter_slug}"
  birth_message:
    topic:    "v1/t/${tenant_slug}/s/${site_slug}/i/${inverter_slug}/status"
    payload:  "online"
    retain:   true
  will_message:
    topic:    "v1/t/${tenant_slug}/s/${site_slug}/i/${inverter_slug}/status"
    payload:  "offline"
    retain:   true
  discovery: false
  log_topic: null
  reboot_timeout: 0s
  keepalive: 30s

# ---- External components: partner MQTT + Solarman V5 -------------
external_components:
  - source:
      type: local
      path: ../components
    components:
      - elite_partner_mqtt
      - elite_solarman_v5

# Endpoint #2: partner MQTT-TLS (anonymous).
elite_partner_mqtt:
  id: partner_mqtt
  broker:        !secret mqtt_partner_broker
  port:          !secret mqtt_partner_port
  username:      !secret mqtt_partner_username
  password:      !secret mqtt_partner_password
  client_id:     "${name}-partner"
  topic_prefix:  "v1/t/${tenant_slug}/s/${site_slug}/i/${inverter_slug}"
  publish_interval: 30s

# Endpoint #3: Solarman cloud V5 binary push.
#
# `register_blocks` mirrors the holding-register windows the stock LSW3
# dongle pulls off the Deye SUN-12K-SG04LP3. Each block becomes one V5
# data-report frame; Solarman cloud joins them back into a sensor stream
# matching what the customer's Deye-app expects. Source for the address
# windows: Lewa-Reka's `deye_hybrid_3p_lv` register map (Apache 2.0) +
# pysolarmanv5 community-documented Solarman frame conventions.
#
# Tweak per inverter family:
#   - SUN-*-SG01LP1 / SG03LP1 (1-phase HV battery) — same windows
#   - SUN-*-SG04LP3 (3-phase LV battery, what we ship) — defaults below
#   - GEN3 hybrids — start range shifts to 0x0500; override per device
elite_solarman_v5:
  id: solarman_cloud
  server:        !secret solarman_server
  port:          !secret solarman_port
  logger_serial: !secret solarman_logger_serial
  modbus_controller_id: ${modbus_controller_id}
  modbus_address: 0x01
  push_interval: 60s
  register_blocks:
    # Identity / firmware version / device class
    - { start: 0x0000, count: 30 }
    # Running parameters: AC volts/amps/freq, PV power, grid power,
    # load power, internal temps. The bulk of what shows up on the
    # Deye-app "Now" screen.
    - { start: 0x0258, count: 60 }
    # Battery: SoC, voltage, charge/discharge current, BMS comms.
    - { start: 0x0640, count: 50 }
    # Settings mirror (work mode, sell-power cap, charge limits).
    # Matches the "Settings" tab in Deye-app so customers see their
    # latest changes propagate.
    - { start: 0x0500, count: 50 }

# ---- Status sensors + reboot button ------------------------------
binary_sensor:
  - platform: status
    name: "Elite Status"

button:
  - platform: restart
    name: "Reboot"
