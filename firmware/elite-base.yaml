# =====================================================================
# Elite Energy overrides on top of Lewa-Reka's deye_hybrid_3p_lv package.
# Included from firmware/devices/*.yaml — never used standalone.
#
# Lewa-Reka already provides: esphome / api / ota / wifi / captive_portal
# / logger / uart / modbus / modbus_controller / diagnostic sensors.
# This file adds the Elite-Energy-specific bits:
#   - Project metadata (overrides Lewa-Reka's so HA + ESP-Web-Tools show
#     the "Elite Energy" brand)
#   - Stock ESPHome MQTT-TLS publisher → mqtt.elite.prygoda.xyz
#   - Solarman cloud V5 binary publisher (gated on elite-cfg.solarman_sn)
#   - elite_provisioning component (reads the elite-cfg NVS namespace)
#   - Status binary sensor + reboot button
#
# v0.2.0 changes vs v0.1.0:
#   - Partner MQTT publisher removed entirely (along with partner secrets).
#   - Solarman publisher now opt-in per device via NVS — leaving
#     elite-cfg.solarman_sn empty disables it (no second TCP connection,
#     no log noise from a 0-serial frame).
#   - Identity (device_id, device_token, mqtt_host) now lives in NVS
#     namespace ``elite-cfg`` and is written by the elite-energy backend
#     ``/api/devices/provision`` endpoint at flash time. The stock
#     ``mqtt:`` block still resolves credentials via ``!secret`` because
#     ESPHome's MQTT component does not accept lambda-typed broker /
#     username / password. Migrating that to NVS is tracked as the
#     PR-A2 follow-up — it requires a custom MQTT external component
#     (or upstream ESPHome support) and a coordinated topic-taxonomy
#     change with the elite-energy ingest worker.
# ---------------------------------------------------------------------

substitutions:
  # WiFi / API / OTA / fallback hotspot creds resolve via !secret.
  # In v0.2.0 the WiFi creds are populated into ESPHome's standard
  # WiFi NVS keys by the web flasher (PR-C of this trio), so the
  # ``!secret`` defaults below act only as the CI / dev-board fallback
  # when secrets.yaml carries them.
  wifi_ssid:           !secret wifi_ssid
  wifi_password:       !secret wifi_password
  fallback_password:   !secret fallback_password
  api_key:             !secret api_key
  ota_password:        !secret ota_password

esphome:
  project:
    name: "elite_energy.dongle"
    version: "0.2.0"
  comment: "Elite Energy dongle — NVS-provisioned, single-publisher (Elite + optional Solarman cloud)"

# Lewa-Reka's package ships an api.encryption.key placeholder that fails
# ESPHome's base64 validator. Override with a real key from secrets.yaml.
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ---- Stock ESPHome MQTT-TLS publisher → mqtt.elite.prygoda.xyz ----
# Topic taxonomy matches infra/emqx/acl.conf in elite-energy:
#   v1/t/{tenant}/s/{site}/i/{inverter}/sensor/{name}/state
#
# Until PR-A2 ships a NVS-driven MQTT component, broker / username /
# password come from ``secrets.yaml`` at build time. The web flasher
# bakes per-device creds in via the ``!secret``-rendered build artefact.
mqtt:
  broker:        !secret mqtt_elite_broker
  port:          !secret mqtt_elite_port
  username:      !secret mqtt_elite_username
  password:      !secret mqtt_elite_password
  client_id:     "${name}-elite"
  topic_prefix:  "v1/t/${tenant_slug}/s/${site_slug}/i/${inverter_slug}"
  birth_message:
    topic:    "v1/t/${tenant_slug}/s/${site_slug}/i/${inverter_slug}/status"
    payload:  "online"
    retain:   true
  will_message:
    topic:    "v1/t/${tenant_slug}/s/${site_slug}/i/${inverter_slug}/status"
    payload:  "offline"
    retain:   true
  discovery: false
  log_topic: null
  reboot_timeout: 0s
  keepalive: 30s

# ---- External components: provisioning + Solarman V5 -------------
external_components:
  - source:
      type: local
      path: ../components
    components:
      - elite_provisioning
      - elite_solarman_v5

# elite_provisioning loads the ``elite-cfg`` NVS namespace at boot
# (priority BUS+1, before WiFi / MQTT / Solarman so they can read it)
# and exposes the values via ``id(provisioning)``-callable getters.
# Other components read from it to avoid baking per-device data into
# the firmware binary.
elite_provisioning:
  id: provisioning

# Solarman cloud V5 binary publisher.
#
# `register_blocks` mirrors the holding-register windows the stock LSW3
# dongle pulls off the Deye SUN-12K-SG04LP3. Each block becomes one V5
# data-report frame; Solarman cloud joins them back into a sensor stream
# matching what the customer's Deye-app expects. Source for the address
# windows: Lewa-Reka's `deye_hybrid_3p_lv` register map (Apache 2.0) +
# pysolarmanv5 community-documented Solarman frame conventions.
#
# In v0.2.0 the LSW3 serial is read from elite-cfg.solarman_sn — leaving
# that key empty in NVS disables the publisher (mark_failed) so loop()
# never spawns the FreeRTOS connect task and no second TCP socket is
# opened.
elite_solarman_v5:
  id: solarman_cloud
  provisioning_id: provisioning
  server:        !secret solarman_server
  port:          !secret solarman_port
  modbus_controller_id: ${modbus_controller_id}
  modbus_address: 0x01
  push_interval: 60s
  register_blocks:
    # Identity / firmware version / device class
    - { start: 0x0000, count: 30 }
    # Running parameters: AC volts/amps/freq, PV power, grid power,
    # load power, internal temps. The bulk of what shows up on the
    # Deye-app "Now" screen.
    - { start: 0x0258, count: 60 }
    # Battery: SoC, voltage, charge/discharge current, BMS comms.
    - { start: 0x0640, count: 50 }
    # Settings mirror (work mode, sell-power cap, charge limits).
    # Matches the "Settings" tab in Deye-app so customers see their
    # latest changes propagate.
    - { start: 0x0500, count: 50 }

# ---- Status sensors + reboot button ------------------------------
binary_sensor:
  - platform: status
    name: "Elite Status"

button:
  - platform: restart
    name: "Reboot"
