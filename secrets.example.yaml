# Copy this file to `secrets.yaml` and fill in real values. `secrets.yaml`
# is gitignored and never committed. For production, real per-device
# secrets come from the elite-energy backend (`fleet.v_mqtt_auth` view)
# at provisioning time.
#
# v0.2.0 dropped the partner MQTT publisher and moved per-device
# identity (device_id / device_token / mqtt_host / WiFi STA creds /
# Solarman LSW3 SN) into the ``elite-cfg`` NVS namespace, written by
# the web flasher. The keys below remain for:
#   - CI ESPHome compile (placeholder values, no real network contact)
#   - direct ``esphome run`` against a dev board with no provisioned
#     NVS partition (legacy workflow before the web flasher v2 ships)

# ----------------- WiFi (home network) -----------------------------
# Defaults for the test board are intentionally weak: the device falls
# back to a captive-portal SoftAP if these don't authenticate.
wifi_ssid:           "Apple"
wifi_password:       "12345678"

# ----------------- Fallback SoftAP (captive portal) ----------------
# Boots if home WiFi is unreachable. Customer connects from a phone,
# opens 192.168.4.1 in the browser, enters real WiFi creds.
fallback_password:   "EliteSetup2026"

# ----------------- ESPHome native API ------------------------------
# Used by `esphome run --device <ip>` for OTA + log streaming.
# Generate a fresh key per device:
#   python3 -c 'import base64,os; print(base64.b64encode(os.urandom(32)).decode())'
api_key:             "VfdYfbO6imz19Yxt57CSNUwMB7dEI4uaN8hxnzMmsZ8="
ota_password:        "changeme-per-device-ota-password"

# ============== ELITE BROKER (single publisher) ====================
# Per-device MQTT-TLS credentials for our prod broker. Until the
# stock ESPHome ``mqtt:`` block grows NVS-driven creds (tracked as
# PR-A2), the web flasher renders these into ``secrets.yaml`` at
# build time before invoking ESPHome.

mqtt_elite_broker:   "mqtt.elite.prygoda.xyz"
mqtt_elite_port:     8883
mqtt_elite_username: "elite-deye-12k-01"
mqtt_elite_password: "REPLACE_WITH_PER_DEVICE_PASSWORD"

# ============== SOLARMAN CLOUD (optional second publisher) ========
# Solarman V5 binary protocol — server / port stay in secrets.yaml
# (they're cloud-wide, not per-device). The 10-digit LSW3 logger SN
# now lives in the ``elite-cfg.solarman_sn`` NVS key and is read by
# elite_solarman_v5 at boot via the elite_provisioning component.
# Leaving the NVS key empty disables this publisher entirely.
solarman_server:     "iot.talent-monitoring.com"
solarman_port:       10000
