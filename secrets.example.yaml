# Copy to `secrets.yaml` and fill in real values. `secrets.yaml` is
# gitignored — never commit real credentials. Real per-device secrets
# come from the elite-energy backend (`fleet.v_mqtt_auth`) when a new
# device is provisioned. For dev/test boards, generate with
#   openssl rand -hex 16

# --- WiFi ----------------------------------------------------------
wifi_ssid:        "REPLACE_WITH_HOME_WIFI_SSID"
wifi_password:    "REPLACE_WITH_HOME_WIFI_PASSWORD"

# Fallback SoftAP that boots if WiFi fails (captive portal for
# (re-)provisioning). Same firmware; different per device only by
# clientid suffix below.
ap_password:      "REPLACE_WITH_AP_PASSWORD_8_TO_63_CHARS"

# --- MQTT broker (Elite Energy production) -------------------------
mqtt_broker:      "elite.prygoda.xyz"
mqtt_port:        18883
mqtt_username:    "REPLACE_WITH_PER_DEVICE_USERNAME"   # e.g. elite-deye-12k-01
mqtt_password:    "REPLACE_WITH_PER_DEVICE_PASSWORD"

# --- OTA (signed pushes from CI) -----------------------------------
ota_password:     "REPLACE_WITH_DEVICE_OTA_PASSWORD"

# --- ESPHome native API password (for esphome run --device) --------
api_password:     "REPLACE_WITH_API_PASSWORD"
