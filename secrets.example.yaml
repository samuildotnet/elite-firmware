# Copy this file to `secrets.yaml` and fill in real values. `secrets.yaml`
# is gitignored and never committed. For production, real per-device
# secrets come from the elite-energy backend (`fleet.v_mqtt_auth` view)
# at provisioning time.

# ----------------- WiFi (home network) -----------------------------
# Defaults for the test board are intentionally weak: the device falls
# back to a captive-portal SoftAP if these don't authenticate.
wifi_ssid:           "Apple"
wifi_password:       "12345678"

# ----------------- Fallback SoftAP (captive portal) ----------------
# Boots if home WiFi is unreachable. Customer connects from a phone,
# opens 192.168.4.1 in the browser, enters real WiFi creds.
fallback_password:   "EliteSetup2026"

# ----------------- ESPHome native API ------------------------------
# Used by `esphome run --device <ip>` for OTA + log streaming.
# Generate a fresh key per device:
#   python3 -c 'import base64,os; print(base64.b64encode(os.urandom(32)).decode())'
api_key:             "VfdYfbO6imz19Yxt57CSNUwMB7dEI4uaN8hxnzMmsZ8="
ota_password:        "changeme-per-device-ota-password"

# ============== TRIPLE-PUBLISHER ENDPOINTS =========================
# The dongle pushes the same telemetry to three places in parallel:
#   1. our prod (elite.prygoda.xyz)
#   2. partner ingestion server
#   3. Solarman cloud (so the customer's Deye-app keeps working)

# ----------------- Endpoint 1: Elite Energy (our prod) -------------
# Per-device username/password. Backend issues these via fleet.v_mqtt_auth.
mqtt_elite_broker:   "elite.prygoda.xyz"
mqtt_elite_port:     8883          # 18883 once hardening PR ships
mqtt_elite_username: "elite-deye-12k-01"
mqtt_elite_password: "REPLACE_WITH_PER_DEVICE_PASSWORD"

# ----------------- Endpoint 2: Partner ----------------------------
# Anonymous TLS MQTT. Partner enables it on demand.
mqtt_partner_broker: "95.60.174.157"
mqtt_partner_port:   8883
mqtt_partner_username: ""           # anonymous
mqtt_partner_password: ""

# ----------------- Endpoint 3: Solarman cloud ---------------------
# Solarman V5 binary protocol. The "logger serial" is the 4-byte ID
# burned into the original LSW3 dongle. Without a real serial Solarman
# cloud will reject frames; you can read the SN sticker on the stock
# dongle (10-digit decimal) and convert to 4-byte LE here.
solarman_server:     "iot.talent-monitoring.com"
solarman_port:       10000
solarman_logger_serial: "0000000000"   # decimal, copy from LSW3 sticker
