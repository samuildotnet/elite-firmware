name: host-tests

on:
  push:
    branches: [main, devin/firmware-bootstrap]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elite-provisioning:
    name: elite_provisioning unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host-side parser tests
        # Compiles ``load_from_reader`` against a stub NvsReader (no
        # ESP-IDF) and exercises the elite-cfg NVS schema across the
        # full happy-path / minimal-config / fail-closed matrix.
        run: make -C firmware/components/elite_provisioning/test
